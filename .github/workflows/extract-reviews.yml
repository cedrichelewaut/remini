name: Extract App Reviews

on:
  push:
    branches:
      - claude/ecstatic-ramanujan-39x0yj
    paths:
      - '.github/workflows/extract-reviews.yml'
      - 'extract_reviews.py'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      store:
        description: 'Which store(s) to fetch from'
        default: 'both'
        type: choice
        options: [play, appstore, both]
      count:
        description: 'Play Store reviews to fetch PER COUNTRY'
        default: '1000'
      appstore_pages:
        description: 'App Store RSS pages PER COUNTRY (~50 reviews/page, ~500 max)'
        default: '10'
      countries:
        description: 'Comma-separated store country codes'
        default: 'us,gb,ca,au,in,id,br,mx,de,fr,it,es,jp,kr,nl,pl,tr,ph,vn,th'
      max_workers:
        description: 'Parallel country fetches'
        default: '8'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run extraction
        run: |
          python extract_reviews.py \
            --store "${{ inputs.store || 'both' }}" \
            --count "${{ inputs.count || '1000' }}" \
            --appstore-pages "${{ inputs.appstore_pages || '10' }}" \
            --countries "${{ inputs.countries || 'us,gb,ca,au,in,id,br,mx,de,fr,it,es,jp,kr,nl,pl,tr,ph,vn,th' }}" \
            --max-workers "${{ inputs.max_workers || '8' }}" \
            --out reviews_output.json \
            --debug

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reviews_output.json
          git diff --staged --quiet || git commit -m "Update reviews_output.json [skip ci]"
          git push
