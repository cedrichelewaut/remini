name: Extract App Reviews

on:
  push:
    branches:
      - claude/ecstatic-ramanujan-39x0yj
    paths:
      - '.github/workflows/extract-reviews.yml'
      - 'extract_reviews.py'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      store:
        description: 'Which store(s) to fetch from'
        default: 'both'
        type: choice
        options: [play, appstore, both]
      count:
        description: 'Number of Play Store reviews to fetch'
        default: '1000'
      appstore_pages:
        description: 'Number of App Store RSS pages (~50 reviews/page)'
        default: '20'
      country:
        description: 'Store country code'
        default: 'us'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run extraction
        run: |
          python extract_reviews.py \
            --store "${{ inputs.store || 'both' }}" \
            --count "${{ inputs.count || '1000' }}" \
            --appstore-pages "${{ inputs.appstore_pages || '20' }}" \
            --country "${{ inputs.country || 'us' }}" \
            --out reviews_output.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews_output.json
          git diff --staged --quiet || git commit -m "Update reviews_output.json [skip ci]"
          git push
